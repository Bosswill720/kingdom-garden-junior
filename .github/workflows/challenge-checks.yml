name: Challenge Lab checks
on:
  push:
    branches: [feature/challenge-learning-1]
  pull_request:
    branches: [main]
    paths:
      - 'challenge*'
      - 'tests/challenge/**'
      - '.github/workflows/challenge-checks.yml'
permissions:
  contents: read
concurrency:
  group: challenge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate 30000 generated questions and wallet isolation
        id: engine
        run: node tests/challenge/core.test.cjs
      - name: Complete authored learning activities in Chromium over HTTP
        if: always()
        run: python tests/challenge/browser_test.py
      - name: Retain test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge-lab-test-reports
          path: reports/
          retention-days: 14
