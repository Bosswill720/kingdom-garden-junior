<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Garden Story Library</title><style>body{background:#f9f0df;color:#294b3b;font-family:system-ui;margin:0}main{max-width:850px;margin:auto;padding:22px}h1{font-size:clamp(30px,6vw,46px);text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fffaf0;border:2px solid #dce6cf;border-radius:24px;padding:18px;box-shadow:0 4px 12px #0001}button{cursor:pointer}.book{width:100%;border:0;background:#e5efdc;border-radius:18px;padding:20px;font:800 20px system-ui;color:#28533e;min-height:180px}.emoji{font-size:70px;display:block;margin-bottom:10px}.panel{background:#fffaf0;border-radius:26px;padding:24px}.line{font:normal clamp(28px,5vw,38px)/1.65 Georgia,serif;text-align:center;color:#302a22}.art{font-size:100px;text-align:center;background:#e7f0df;border-radius:24px;padding:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.control{flex:1;border:0;border-radius:18px;background:#376a4f;color:white;font:bold 21px system-ui;padding:18px;min-height:62px}.secondary{background:#dce9d6;color:#28533e}.word{border:0;background:none;font:inherit;color:inherit;padding:2px}.word.active{background:#ffe08c;border-radius:6px}.hidden{display:none}.small{text-align:center;color:#5c735e}</style><style>
@keyframes bookFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes gentleSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes pageAppear{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.book{transition:transform .2s,box-shadow .2s}.book:hover,.book:focus-visible{transform:translateY(-4px);box-shadow:0 9px 20px #294b3b25}.book:active{transform:scale(.97)}.emoji{animation:bookFloat 3s ease-in-out infinite}.card{animation:popIn .35s ease both}.card:nth-child(3n) .emoji{animation-delay:.5s}.card:nth-child(3n + 1) .emoji{animation-delay:1s}.art{animation:gentleSway 3s ease-in-out infinite}#line{animation:pageAppear .3s ease}.control:active{transform:scale(.97)}button:focus-visible{outline:4px solid #d39e41;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main><a href="./" style="color:#28533e">← Kingdom Garden Junior</a><h1>📚 My Story Library</h1><section id="library"><p class="small">Choose from 28 stories! Tap a colorful book to read or listen.</p><div class="grid" id="books"></div></section><section id="reader" class="panel hidden"><h1 id="title"></h1><div class="art" id="art"></div><p class="line" id="line"></p><p class="small" id="progress"></p><div class="controls"><button class="control" id="listen">🔊 Read to Me</button><button class="control secondary" id="stop">⏹ Stop</button></div><div class="controls"><button class="control secondary" id="prev">⬅ Back</button><button class="control" id="next">Next Page ➜</button></div><div class="controls"><button class="control secondary" id="return">📚 All Stories</button></div></section></main><script>const stories=[["Benny Bunny's Big School Day","🐰🎒",["Benny has a new bag.","Today is his first school day.","His tummy feels funny.","Mom gives him a big hug.","Benny sees a red door.","A friend says, Hello!","They build a tall tower.","Benny smiles all the way home."]],["Bo Bird's Happy Song","🐦🎵",["Bo wants to sing a song.","Tweet, tweet, tweet!","The wind goes whoosh.","The rain goes drip, drip.","The frog goes ribbit.","Bo sings with his friends.","What a funny song!","They sing it again."]],["Milo Bear's Mixed-Up Picnic","🐻🧺",["Milo packs a picnic.","He brings a big red apple.","Oops! Where is the bread?","It is under his hat!","Where is the juice?","It is beside the tree.","His friends laugh with him.","What a silly, happy day!"]],["Pip and the Rainbow Boots","🦊🥾",["Pip has yellow boots.","He steps in green grass.","He steps in brown mud.","Oh! His boots are messy.","Pip finds a blue stream.","Swish, swish, swish!","His boots are clean again.","Pip jumps for joy!"]],["Luna Mouse and the Lost Star","🐭⭐",["Luna sees a little star.","It falls behind a tree.","Oh no! says Luna.","She takes her small lamp.","She looks high and low.","There is the star!","The star shines up high.","Good night, little star."]],["Nora and the Big Red Kite","🐿️🪁",["Nora has a red kite.","The wind blows softly.","Up, up, up!","The kite goes so high.","Then the wind stops.","Down comes the kite.","Nora tries again.","Up, up, up it goes!"]],["The Little Garden Party","🌷🐝",["Pip plants a pink flower.","Benny brings a blue cup.","Bo sings a happy song.","Milo brings sweet berries.","Buzz! A bee comes by.","Everyone says hello.","They share and laugh.","What a lovely garden day!"]],["Tilly Turtle Takes Her Time","🐢🌼",["Tilly walks very slowly.","Her friends run ahead.","Wait for me! says Tilly.","She sees a yellow flower.","She sees a shiny stone.","Her friends come back.","Look what I found!","Slow can be wonderful too."]],["Pip's Magic Shoes","🦊👟",["Pip has new blue shoes.","Tap, tap, tap!","He runs to the gate.","His shoes go squeak!","Pip starts to dance.","His friends dance too.","Tap, tap, tap!","What happy shoes!"]],["Benny's Big Race","🐰🏁",["Benny hops to the line.","Ready, set, go!","Hop, hop, hop!","A snail needs help.","Benny stops to help.","The snail says thank you.","They cross the line together.","Hooray for good friends!"]],["Milo's Silly Hat","🐻🎩",["Milo finds a tall hat.","It is much too big.","Whoosh! The wind blows.","The hat flies away.","A bird lands inside.","Milo laughs and laughs.","The bird flies home.","Milo waves goodbye."]],["The Dancing Duck","🦆🎶",["Dot Duck hears a beat.","Tap, tap, tap!","She shakes her tail.","Wiggle, wiggle, wiggle!","Her friends clap along.","Dot spins in a circle.","Everyone dances together.","What a fun day!"]],["The Rainbow Flower","🌈🌸",["Luna plants a tiny seed.","She gives it water.","The sun comes out.","A red petal pops up.","Then blue and yellow!","A rainbow flower grows.","Luna smiles so big.","The garden shines bright."]],["The Secret Garden Door","🚪🗝️",["Pip sees a little door.","It is behind a tree.","Knock, knock, knock!","The door opens slowly.","A butterfly flies out.","A garden is inside!","Pip steps in softly.","What a magic place!"]],["Luna's Sleepy Moon","🐭🌙",["Luna sees the moon.","It glows above her bed.","The stars twinkle softly.","Luna puts on pajamas.","She hugs her little bear.","Good night, moon.","Good night, stars.","Luna closes her eyes."]],["Goodnight, Garden","🏡🌜",["The sun goes down.","The flowers close up.","The bees go home.","The birds stop singing.","Pip waves to the trees.","Good night, little garden.","The moon shines above.","Sleep well, everyone."]],["The Color Hunt","🎨🦋",["Pip looks for red.","He finds a red apple.","Pip looks for blue.","He finds a blue bird.","Pip looks for green.","He finds a green leaf.","So many colors!","What color comes next?"]],["Count with Pip","🦊🔢",["Pip sees one sun.","He sees two birds.","Three flowers grow.","Four bees buzz by.","Five frogs hop.","Pip counts them all.","One, two, three, four, five!","Counting is fun!"]],["The Bubble Surprise","🫧🐰",["Benny blows one bubble.","Pop! It goes away.","He blows two more.","Pop, pop!","A big bubble floats up.","Benny runs after it.","The bubble shines in the sun.","Pop! What a surprise!"]],["Bo's Windy Day","🐦🍃",["Bo wakes to the wind.","Whoosh goes the tree.","Whoosh goes the grass.","His little hat flies off.","Bo flies up high.","He catches his hat.","The wind calms down.","Bo sings a happy tune."]],["The Friendly Dragon","🐉🌻",["A small dragon feels shy.","He hides by a rock.","Pip says hello.","The dragon waves back.","He blows a tiny puff.","A flower sways gently.","They laugh together.","Now they are friends!"]],["Milo Makes Soup","🐻🥕",["Milo finds a carrot.","He finds a potato.","He washes them clean.","Chop, chop, chop!","The pot goes bubble, bubble.","The soup smells good.","Milo shares with friends.","Yum, yum, yum!"]],["The Lost Red Balloon","🎈🐿️",["Nora has a red balloon.","The string slips away.","Up goes the balloon!","Nora looks up high.","A bird flies beside it.","The balloon lands in a tree.","A friend helps Nora.","Thank you, my friend!"]],["Pip Builds a Boat","🦊⛵",["Pip finds a big leaf.","He finds a little stick.","He makes a tiny boat.","Splash! Into the stream.","The boat floats away.","Pip runs beside it.","Go, little boat, go!","The boat reaches the pond."]],["Tilly's Tiny Treasure","🐢💎",["Tilly sees a shiny stone.","It is small and blue.","She puts it in her bag.","A friend loses a stone.","Tilly looks inside.","Is this yours? she asks.","Yes! says her friend.","Sharing feels wonderful."]],["The Starry Campout","⛺⭐",["Pip and Benny make a tent.","They bring warm blankets.","The sky turns dark.","One star shines above.","Then many stars appear.","They tell a silly story.","They hear a soft owl.","Good night, little stars."]],["Nora's Snowy Surprise","🐿️❄️",["Nora sees white snow.","It covers the garden.","Crunch, crunch, crunch!","She makes a snowball.","She rolls it around.","Now it is so big!","Her friends make a snow friend.","They wave and smile."]],["The Garden Birthday","🎂🌷",["Today is Bo's birthday.","Pip brings a flower.","Benny brings a card.","Milo brings a cake.","They sing a happy song.","Bo blows out a candle.","Hooray! say the friends.","What a lovely birthday!"]]];const $=id=>document.getElementById(id);let current=0,page=0;function stop(){if("speechSynthesis"in window)speechSynthesis.cancel()}function speak(t){stop();if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;u.pitch=1.05;speechSynthesis.speak(u)}function render(){stop();const s=stories[current];$("title").textContent=s[0];$("art").textContent=s[1];$("line").replaceChildren();s[2][page].split(" ").forEach(w=>{const b=document.createElement("button");b.className="word";b.textContent=w;b.onclick=()=>speak(w);$("line").append(b," ")});$("progress").textContent="Page "+(page+1)+" of "+s[2].length;$("prev").disabled=page===0;$("next").textContent=page===s[2].length-1?"Read Again ↻":"Next Page ➜"}stories.forEach((s,i)=>{const card=document.createElement("div");card.className="card";const b=document.createElement("button");b.className="book";const e=document.createElement("span");e.className="emoji";e.textContent=s[1];b.append(e,document.createTextNode(s[0]));b.onclick=()=>{current=i;page=0;$("library").classList.add("hidden");$("reader").classList.remove("hidden");render()};card.append(b);$("books").append(card)});$("listen").onclick=()=>speak(stories[current][2][page]);$("stop").onclick=stop;$("prev").onclick=()=>{if(page>0){page--;render()}};$("next").onclick=()=>{page=(page+1)%stories[current][2].length;render()};$("return").onclick=()=>{stop();$("reader").classList.add("hidden");$("library").classList.remove("hidden")};</script><script>
/* Optional recorded narration for story library. Falls back to existing device speech. */
(function(){
const audio=new Audio();audio.preload="metadata";let playing=false;
const status=document.createElement("p");status.className="small";status.textContent="Natural narration will be available after recordings are generated.";
const button=document.getElementById("listen");button.parentNode.insertBefore(status,button.parentNode.nextSibling);
const original=button.onclick;
const originalStop=document.getElementById("stop").onclick;
const getPage=()=>{const title=document.getElementById("title").textContent;const m=document.getElementById("progress").textContent.match(/Page (\d+)/);return {story:stories.findIndex(x=>x[0]===title)+1,page:m?Number(m[1]):1}};
function halt(){audio.pause();audio.removeAttribute("src");audio.load();playing=false;button.textContent="🔊 Read to Me"}
button.onclick=async function(){
 const p=getPage();const url="./audio/story-"+p.story+"/page-"+p.page+".mp3";
 if(playing&&!audio.paused){audio.pause();button.textContent="▶ Resume";return}
 if(playing&&audio.paused){try{await audio.play();button.textContent="⏸ Pause";return}catch(e){halt()}}
 try{
  audio.src=url;
  await audio.play();playing=true;button.textContent="⏸ Pause";status.textContent="Natural storyteller narration";
 }catch(e){halt();status.textContent="Using iPad built-in narration until recordings are ready";original()}
};
audio.onended=()=>{halt();status.textContent="Page finished!"};
document.getElementById("stop").onclick=function(){halt();originalStop()};
for(const id of ["prev","next","return"]){const b=document.getElementById(id),fn=b.onclick;b.onclick=function(e){halt();fn.call(this,e)}}
const cards=document.querySelectorAll(".book");cards.forEach(b=>{const fn=b.onclick;b.onclick=function(e){halt();fn.call(this,e)}});
})();
</script></body></html>
