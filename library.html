<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Garden Story Library</title><style>body{background:#f9f0df;color:#294b3b;font-family:system-ui;margin:0}main{max-width:850px;margin:auto;padding:22px}h1{font-size:clamp(30px,6vw,46px);text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fffaf0;border:2px solid #dce6cf;border-radius:24px;padding:18px;box-shadow:0 4px 12px #0001}button{cursor:pointer}.book{width:100%;border:0;background:#e5efdc;border-radius:18px;padding:20px;font:800 20px system-ui;color:#28533e;min-height:180px}.emoji{font-size:70px;display:block;margin-bottom:10px}.panel{background:#fffaf0;border-radius:26px;padding:24px}.line{font:normal clamp(28px,5vw,38px)/1.65 Georgia,serif;text-align:center;color:#302a22}.art{font-size:100px;text-align:center;background:#e7f0df;border-radius:24px;padding:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.control{flex:1;border:0;border-radius:18px;background:#376a4f;color:white;font:bold 21px system-ui;padding:18px;min-height:62px}.secondary{background:#dce9d6;color:#28533e}.word{border:0;background:none;font:inherit;color:inherit;padding:2px}.word.active{background:#ffe08c;border-radius:6px}.hidden{display:none}.small{text-align:center;color:#5c735e}</style></head><body><main><a href="./" style="color:#28533e">← Kingdom Garden Junior</a><h1>📚 My Story Library</h1><section id="library"><p class="small">Choose a story to read or hear aloud!</p><div class="grid" id="books"></div></section><section id="reader" class="panel hidden"><h1 id="title"></h1><div class="art" id="art"></div><p class="line" id="line"></p><p class="small" id="progress"></p><div class="controls"><button class="control" id="listen">🔊 Read to Me</button><button class="control secondary" id="stop">⏹ Stop</button></div><div class="controls"><button class="control secondary" id="prev">⬅ Back</button><button class="control" id="next">Next Page ➜</button></div><div class="controls"><button class="control secondary" id="return">📚 All Stories</button></div></section></main><script>const stories=[["Benny Bunny's Big School Day","🐰🎒",["Benny has a new bag.","Today is his first school day.","His tummy feels funny.","Mom gives him a big hug.","Benny sees a red door.","A friend says, Hello!","They build a tall tower.","Benny smiles all the way home."]],["Bo Bird's Happy Song","🐦🎵",["Bo wants to sing a song.","Tweet, tweet, tweet!","The wind goes whoosh.","The rain goes drip, drip.","The frog goes ribbit.","Bo sings with his friends.","What a funny song!","They sing it again."]],["Milo Bear's Mixed-Up Picnic","🐻🧺",["Milo packs a picnic.","He brings a big red apple.","Oops! Where is the bread?","It is under his hat!","Where is the juice?","It is beside the tree.","His friends laugh with him.","What a silly, happy day!"]],["Pip and the Rainbow Boots","🦊🥾",["Pip has yellow boots.","He steps in green grass.","He steps in brown mud.","Oh! His boots are messy.","Pip finds a blue stream.","Swish, swish, swish!","His boots are clean again.","Pip jumps for joy!"]],["Luna Mouse and the Lost Star","🐭⭐",["Luna sees a little star.","It falls behind a tree.","Oh no! says Luna.","She takes her small lamp.","She looks high and low.","There is the star!","The star shines up high.","Good night, little star."]],["Nora and the Big Red Kite","🐿️🪁",["Nora has a red kite.","The wind blows softly.","Up, up, up!","The kite goes so high.","Then the wind stops.","Down comes the kite.","Nora tries again.","Up, up, up it goes!"]],["The Little Garden Party","🌷🐝",["Pip plants a pink flower.","Benny brings a blue cup.","Bo sings a happy song.","Milo brings sweet berries.","Buzz! A bee comes by.","Everyone says hello.","They share and laugh.","What a lovely garden day!"]],["Tilly Turtle Takes Her Time","🐢🌼",["Tilly walks very slowly.","Her friends run ahead.","Wait for me! says Tilly.","She sees a yellow flower.","She sees a shiny stone.","Her friends come back.","Look what I found!","Slow can be wonderful too."]]];const $=id=>document.getElementById(id);let current=0,page=0;function stop(){if("speechSynthesis"in window)speechSynthesis.cancel()}function speak(t){stop();if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;u.pitch=1.05;speechSynthesis.speak(u)}function render(){stop();const s=stories[current];$("title").textContent=s[0];$("art").textContent=s[1];$("line").replaceChildren();s[2][page].split(" ").forEach(w=>{const b=document.createElement("button");b.className="word";b.textContent=w;b.onclick=()=>speak(w);$("line").append(b," ")});$("progress").textContent="Page "+(page+1)+" of "+s[2].length;$("prev").disabled=page===0;$("next").textContent=page===s[2].length-1?"Read Again ↻":"Next Page ➜"}stories.forEach((s,i)=>{const card=document.createElement("div");card.className="card";const b=document.createElement("button");b.className="book";const e=document.createElement("span");e.className="emoji";e.textContent=s[1];b.append(e,document.createTextNode(s[0]));b.onclick=()=>{current=i;page=0;$("library").classList.add("hidden");$("reader").classList.remove("hidden");render()};card.append(b);$("books").append(card)});$("listen").onclick=()=>speak(stories[current][2][page]);$("stop").onclick=stop;$("prev").onclick=()=>{if(page>0){page--;render()}};$("next").onclick=()=>{page=(page+1)%stories[current][2].length;render()};$("return").onclick=()=>{stop();$("reader").classList.add("hidden");$("library").classList.remove("hidden")};</script><script>
/* Optional recorded narration for story library. Falls back to existing device speech. */
(function(){
const audio=new Audio();audio.preload="metadata";let playing=false;
const status=document.createElement("p");status.className="small";status.textContent="Natural narration will be available after recordings are generated.";
const button=document.getElementById("listen");button.parentNode.insertBefore(status,button.parentNode.nextSibling);
const original=button.onclick;
const originalStop=document.getElementById("stop").onclick;
const getPage=()=>{const title=document.getElementById("title").textContent;const m=document.getElementById("progress").textContent.match(/Page (\d+)/);return {story:stories.findIndex(x=>x[0]===title)+1,page:m?Number(m[1]):1}};
function halt(){audio.pause();audio.removeAttribute("src");audio.load();playing=false;button.textContent="🔊 Read to Me"}
button.onclick=async function(){
 const p=getPage();const url="./audio/story-"+p.story+"/page-"+p.page+".mp3";
 if(playing&&!audio.paused){audio.pause();button.textContent="▶ Resume";return}
 if(playing&&audio.paused){try{await audio.play();button.textContent="⏸ Pause";return}catch(e){halt()}}
 try{
  audio.src=url;
  await audio.play();playing=true;button.textContent="⏸ Pause";status.textContent="Natural storyteller narration";
 }catch(e){halt();status.textContent="Using iPad built-in narration until recordings are ready";original()}
};
audio.onended=()=>{halt();status.textContent="Page finished!"};
document.getElementById("stop").onclick=function(){halt();originalStop()};
for(const id of ["prev","next","return"]){const b=document.getElementById(id),fn=b.onclick;b.onclick=function(e){halt();fn.call(this,e)}}
const cards=document.querySelectorAll(".book");cards.forEach(b=>{const fn=b.onclick;b.onclick=function(e){halt();fn.call(this,e)}});
})();
</script></body></html>
