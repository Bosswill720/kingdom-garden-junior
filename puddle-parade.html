<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip and the Puddle Parade</title><style>body{background:#f8f0df;color:#2c523e;font-family:system-ui;margin:0}main{max-width:680px;margin:auto;padding:22px}article{background:#fffaf0;border-radius:28px;padding:24px;margin-top:20px;min-height:65vh}h1{text-align:center;font-size:clamp(28px,6vw,42px)}.art{text-align:center;font-size:clamp(85px,18vw,150px);background:#e4efdd;border-radius:25px;padding:20px}.line{text-align:center;font:normal clamp(27px,5.5vw,38px)/1.55 Georgia,serif;color:#30291f}.word{background:none;border:0;font:inherit;color:inherit;padding:2px}.word.active{background:#ffe28a;border-radius:6px}nav{display:flex;gap:10px;flex-wrap:wrap}button.control,a.control{border:0;border-radius:18px;background:#376a4f;color:white;font:bold 21px system-ui;padding:16px;flex:1;text-align:center;text-decoration:none;min-height:60px}button:disabled{opacity:.3}.hint{text-align:center;font-size:15px}</style></head><body><main><a href="./" style="color:#376a4f">← Kingdom Garden Junior</a><article><h1 id="title"></h1><div class="art" id="art"></div><div id="text"></div><p class="hint" id="status">Tap Read to Me to listen!</p><nav><button class="control" id="listen">🔊 Read to Me</button><button class="control" id="stop">⏹ Stop</button></nav><nav style="margin-top:12px"><button class="control" id="back">⬅ Back</button><button class="control" id="next">Next Page ➜</button></nav><p class="hint" id="page"></p></article></main><script>
const story=[["Pip and the Puddle Parade","🦊🌧️","Rain, rain, rain!","Pip puts on his red boots.","Splash, splash, splash!"],["A Tiny Puddle","🦊💦","Pip sees a tiny puddle.","He jumps right in.","Plip, plop, splash!"],["A Big Puddle","🦊🌊","Pip sees a BIG puddle.","He jumps right in.","SPLISH, SPLASH, SPLASH!"],["A Frog Friend","🐸🦊","A frog pops up.","Ribbit! says the frog.","Hello! says Pip."],["The Muddy Boots","🥾🟤","Oh no! Pip's boots are muddy.","Pip looks down.","He starts to giggle."],["A Rainbow","🌈☀️","The rain stops.","A rainbow fills the sky.","Wow! says Pip."],["The Parade","🦊🐸🐰","Pip calls his friends.","Step, step, splash!","What a happy parade!"],["Home Again","🏡🦊","Pip is warm and dry.","He hangs up his boots.","Tomorrow, let's splash again!"]];let index=0;const $=id=>document.getElementById(id);function stop(){if("speechSynthesis"in window)speechSynthesis.cancel();document.querySelectorAll(".word").forEach(x=>x.classList.remove("active"))}
function speak(t){stop();if(!("speechSynthesis"in window)){$("status").textContent="Speech is not supported here.";return}const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.83;u.pitch=1.06;u.onend=()=>{$("status").textContent="Great listening!"};speechSynthesis.speak(u)}
function render(){stop();const s=story[index];$("title").textContent=s[0];$("art").textContent=s[1];$("text").replaceChildren();s.slice(2).forEach(line=>{const p=document.createElement("p");p.className="line";line.split(" ").forEach(w=>{const b=document.createElement("button");b.className="word";b.textContent=w;b.onclick=()=>speak(w);p.append(b," ")});$("text").append(p)});$("page").textContent="Page "+(index+1)+" of "+story.length;$("back").disabled=index===0;$("next").textContent=index===story.length-1?"Read Again ↻":"Next Page ➜";$("status").textContent="Tap Read to Me to listen!"}
$("listen").onclick=()=>speak(story[index].slice(2).join(" "));$("stop").onclick=stop;$("back").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{index=(index+1)%story.length;render()};render();
</script></body></html>
